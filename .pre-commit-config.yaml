repos:
  # Validación de formato de mensajes de commit (feat:, fix:, etc.)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

