services:
  spark-master:
    image: apache/spark:4.0.1-java21-python3
    container_name: spark-master
    command: bash -c "/opt/spark/sbin/start-master.sh && tail -f /opt/spark/logs/spark*.out"
    ports:
      - "8080:8080"
      - "7077:7077"

  spark-worker:
    image: apache/spark:4.0.1-java21-python3
    depends_on:
      - spark-master
    command: bash -c "/opt/spark/sbin/start-worker.sh spark://spark-master:7077 && tail -f /opt/spark/logs/spark*.out"
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g